name: XML-CII 2019 Final RIGID weight review / v0.35 port
on:
  pull_request:
    paths:
      - '.github/workflows/xml-cii-final-rigid-v035-port.yml'
      - 'tabs/xml-cii-2019-standalone/**'
      - 'converters/xml-cii2019-core/weight-match-model.js'
      - 'tests/xml-cii-final-*.test.mjs'
      - 'tests/fixtures/final-cii-property-ui-host.html'
      - 'tests/xml-cii-final-v04-integration.test.mjs'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  final-rigid-engineering-gates:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check ported modules and v0.4 output integration
        shell: bash
        run: |
          set -euo pipefail
          for module in tabs/xml-cii-2019-standalone/xml-cii-final-{rigid,property}-*.js             tabs/xml-cii-2019-standalone/ui-adapted/xml-cii-adapted-final-rigid-review.js             tabs/xml-cii-2019-standalone/ui-adapted/xml-cii-adapted-output-run.js             tabs/xml-cii-2019-standalone/xml-cii-workflow-service.js; do
            node --check "$module"
          done
          node --test tests/xml-cii-final-v04-integration.test.mjs tests/xml-cii-final-rigid-remediation.test.mjs
          node --test tests/xml-cii-glrd-release-cache-chain.test.mjs
          node --test tests/rigid-weight-empirical-audit.test.mjs
      - name: Full property transaction, adversarial and source context tests
        shell: bash
        run: |
          set -euo pipefail
          node --test             tests/xml-cii-final-rigid-review.test.mjs             tests/xml-cii-final-property-transactions.test.mjs             tests/xml-cii-final-property-scale.test.mjs             tests/xml-cii-final-property-mutations.test.mjs             tests/xml-cii-final-rigid-source-context.test.mjs             tests/xml-cii-final-rigid-nearest-suggestions.test.mjs             tests/xml-cii-final-rigid-master-reference.test.mjs             tests/xml-cii-final-rigid-context-fallback.test.mjs             tests/xml-cii-final-rigid-batch-corrections.test.mjs             tests/xml-cii-final-rigid-review-evidence.test.mjs             tests/xml-cii-regex-preview-token-authority.test.mjs             tests/xml-cii-final-rigid-source-mutations.test.mjs             tests/xml-cii-final-rigid-source-scale.test.mjs             tests/xml-cii-final-rigid-length-error.test.mjs
      - name: Install isolated browser for final property editor replay
        run: |
          npm install --no-save --package-lock=false playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Pin Owner GLRD source and stage from uploaded archive manifests
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/glrd-191
          root='https://raw.githubusercontent.com/reallakshman19/3D_Converters/3377b7f4baeeee5851e72dcc414d6c4a93f5a933/Benchmarks/XML-CII-2019/revamped'
          curl -fsSL --retry 3 "$root/GLRD-1000-PI-01%20-%20BM2.xml" -o '/tmp/glrd-191/GLRD-1000-PI-01 - BM2.xml'
          curl -fsSL --retry 3 "$root/STF_2026Nov03-0839_managed_stage.json" -o '/tmp/glrd-191/STF_2026Nov03-0839_managed_stage.json'
          echo '6bcc477860fdbe9a80159839bf476a8c1e6ce7a966587a25bc62498709843151  /tmp/glrd-191/GLRD-1000-PI-01 - BM2.xml' | sha256sum -c -
          echo '1d2469fe05d712cd1dd2da9913a840516ae686fb1616eb6d7b5e14d8918e2746  /tmp/glrd-191/STF_2026Nov03-0839_managed_stage.json' | sha256sum -c -
      - name: Browser verify RIGID pointer listing, preview, apply and source byte preservation
        shell: bash
        env:
          GLRD_E2E_XML_FILE: /tmp/glrd-191/GLRD-1000-PI-01 - BM2.xml
          GLRD_E2E_STAGE_FILE: /tmp/glrd-191/STF_2026Nov03-0839_managed_stage.json
        run: |
          set -euo pipefail
          node --test tests/xml-cii-final-property-browser.test.mjs
      - name: Existing v0.4 output workflow and mass audit guards
        shell: bash
        run: |
          set -euo pipefail
          node --test tests/rigid-weight-run-gate.integration.test.mjs
          node --test tests/xml-cii-standalone-output-run.test.js
      - name: Record exact qualified head
        shell: bash
        run: |
          printf 'SHA=%s\nFINAL_RIGID_PORT_TEST=SUCCESS\nSOURCE_CII_IMMUTABLE=REQUIRED\n' "$GITHUB_SHA" | tee final-rigid-port-verification.txt
      - name: Upload qualification receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v04-final-rigid-port-${{ github.sha }}
          path: |
            final-rigid-port-verification.txt
            test-results/**
          if-no-files-found: warn
