name: Deploy app to GitHub Pages

on:
  # Every PR/branch merge into main creates a push to main.
  # This also intentionally deploys any direct main update.
  push:
    branches:
      - main

  # Manual production redeploy when needed.
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy static app
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout main
        uses: actions/checkout@v4

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload static application
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Verify public Phase 6 assets equal the exact merged commit
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          set -euo pipefail
          python3 scripts/verify-xmlcii-pages-deploy.py

      - name: Publish live deployment byte-parity receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase6-live-deploy-byte-parity-${{ github.sha }}
          path: artifacts/phase6-pages-deployment-verification.json
          if-no-files-found: warn
