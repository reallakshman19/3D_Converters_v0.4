name: Empirical unknown component length suggestions
on:
  push:
    branches:
      - feat/unknown-component-weight-length-rules-20261107
  pull_request:
    paths:
      - 'converters/empirical-weight/**'
      - 'converters/xml-cii2019-core/flange-weight-fallback.js'
      - 'converters/xml-cii2019-core/weight-valve-hints.js'
      - 'converters/xml-cii2019-core/rigid-weight-auto-apply.js'
      - 'tabs/xml-cii-2019-standalone/xml-cii-standalone-run-parity.js'
      - 'tabs/empirical-weight-tuning-tab.js'
      - 'tabs/model-converters/converters/xmltocii2019_helper/weight-match-renderer.js'
      - 'tabs/xml-cii-2019-standalone/ui-adapted/xml-cii-adapted-weight-match.js'
      - 'tabs/xml-cii-2019-standalone/ui-adapted/xml-cii-adapted-run-workflow.js'
      - 'tabs/xml-cii-2019-standalone/ui-adapted/xml-cii-adapted-run-workflow-atta-default.js'
      - 'tabs/xml-cii-2019-standalone/ui-adapted/xml-cii-adapted-rigid-review-mode-a.js'
      - 'converters/xml-cii2019-core/physical-mass-approval.js'
      - 'tabs/xml-cii-2019-standalone/ui-adapted/xml-cii-adapted-mode-a-bulk-weight.js'
      - 'tabs/xml-cii-2019-standalone/ui-adapted/xml-cii-adapted-mode-a-consolidated.js'
      - 'tabs/xml-cii-2019-standalone/ui-adapted/xml-cii-adapted-mode-a-consolidated-easy-weight-ui.js'
      - 'tabs/xml-cii-2019-standalone/ui-adapted/xml-cii-adapted-mode-a-weight-tools.js'
      - 'tabs/xml-cii-2019-standalone/ui-adapted/xml-cii-adapted-mode-a-weight-actions.js'
      - 'tests/xml-cii-mode-a-easy-weight.test.mjs'
      - 'tests/xml-cii-weight-match-content-cache.test.mjs'
      - 'scripts/verify-empirical-ir-r3-mode-a-browser.mjs'
      - 'tabs/xml-cii-2019-standalone/ui-adapted/xml-cii-adapted-mode-a-rigid-review-tools.js'
      - 'scripts/verify-empirical-ir-r2-browser.mjs'
      - 'tabs/xml-cii-2019-standalone/xml-cii-rigid-smart-fill.js'
      - 'tabs/xml-cii-2019-standalone/ui-adapted/xml-cii-adapted-rigid-smart-fill-ui.js'
      - 'tests/empirical-unknown-*.test.mjs'
      - 'tabs/xml-cii-2019-standalone/ui-adapted/xml-cii-adapted-rigid-review-prefill.js'
      - 'tabs/xml-cii-2019-standalone/ui-adapted/xml-cii-adapted-rigid-review-mode-a.js'
      - 'tabs/xml-cii-2019-standalone/ui-adapted/xml-cii-adapted-mode-a-rigid-review-tools.js'
      - 'tests/xml-cii-rigid-review-prefill.test.mjs'
      - 'scripts/verify-glrd-rigid-review-popups-browser.mjs'
      - 'scripts/verify-glrd-bm2-native-parity.py'
      - 'scripts/verify-empirical-nearest-browser.mjs'
      - '.github/workflows/empirical-unknown-component-length.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native-empirical-and-standalone-advisory:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax and import checks
        run: |
          node --check converters/empirical-weight/unknown-component-length-suggestion.js
          node --check converters/xml-cii2019-core/flange-weight-fallback.js
          node --check converters/xml-cii2019-core/weight-valve-hints.js
          node --check converters/xml-cii2019-core/rigid-weight-auto-apply.js
          node --check tabs/xml-cii-2019-standalone/xml-cii-standalone-run-parity.js
          node --check tabs/empirical-weight-tuning-tab.js
          node --check tabs/model-converters/converters/xmltocii2019_helper/weight-match-renderer.js
          node --check tabs/xml-cii-2019-standalone/ui-adapted/xml-cii-adapted-weight-match.js
          node --check tabs/xml-cii-2019-standalone/ui-adapted/xml-cii-adapted-rigid-review-prefill.js
          node --check scripts/verify-glrd-rigid-review-popups-browser.mjs
          node --check tabs/xml-cii-2019-standalone/ui-adapted/xml-cii-adapted-rigid-review-mode-a.js
          node --check tabs/xml-cii-2019-standalone/ui-adapted/xml-cii-adapted-mode-a-rigid-review-tools.js
          node --check scripts/verify-empirical-nearest-browser.mjs
          node --check scripts/verify-empirical-ir-r2-browser.mjs
          node --check tabs/xml-cii-2019-standalone/xml-cii-rigid-smart-fill.js
          node --check tabs/xml-cii-2019-standalone/ui-adapted/xml-cii-adapted-rigid-smart-fill-ui.js
          node --check tabs/xml-cii-2019-standalone/ui-adapted/xml-cii-adapted-run-workflow.js
          node --check tabs/xml-cii-2019-standalone/ui-adapted/xml-cii-adapted-run-workflow-atta-default.js
          node --check tabs/xml-cii-2019-standalone/ui-adapted/xml-cii-adapted-rigid-review-mode-a.js
          node --check tabs/xml-cii-2019-standalone/ui-adapted/xml-cii-adapted-mode-a-bulk-weight.js
          node --check tabs/xml-cii-2019-standalone/ui-adapted/xml-cii-adapted-mode-a-weight-tools.js
          node --check tabs/xml-cii-2019-standalone/ui-adapted/xml-cii-adapted-mode-a-weight-actions.js
          node --check tabs/xml-cii-2019-standalone/ui-adapted/xml-cii-adapted-mode-a-consolidated.js
          node --check converters/xml-cii2019-core/physical-mass-approval.js
          node --check scripts/verify-empirical-ir-r3-mode-a-browser.mjs
          node --check tabs/xml-cii-2019-standalone/ui-adapted/xml-cii-adapted-mode-a-rigid-review-tools.js
      - name: Unknown length rule and Weight Match non-auto-apply tests
        run: |
          node --test tests/empirical-unknown-component-length-suggestion.test.mjs
          node --test tests/empirical-unknown-weight-match-advisory.test.mjs
          node tests/xml-cii-mode-a-consolidated-rigid-review.test.mjs
          node tests/xml-cii-mode-a-easy-weight.test.mjs
          node --test tests/xml-cii-weight-match-content-cache.test.mjs
          node tests/xml-cii-smart-ui-preflight.test.mjs
          node --test tests/empirical-unknown-stage2-review-falsifiers.test.mjs
          node --test tests/xml-cii-weight-nearest-known-family-regression.test.mjs
          node --test tests/xml-cii-rigid-review-prefill.test.mjs
      - name: Existing nearest API, flange identity and Sandbox regression
        run: |
          node --test tests/empirical-weight-nearest-interpolation.test.mjs
          node --test tests/empirical-weight-sandbox.test.mjs
          node --test tests/empirical-weight-sandbox-ui-static.test.mjs
          node tests/xml-cii-node460-flange-weight.test.mjs
      - name: Install Chromium
        run: |
          npm install --no-save --package-lock=false playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Serve browser Sandbox fixture
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/empirical-unknown-browser.log 2>&1 &
          node -e "const u='http://127.0.0.1:4173'; let n=0; const p=async()=>{try{const r=await fetch(u); if(r.ok)return;}catch{}if(++n>60)process.exit(1);setTimeout(p,500)};p();"
      - name: Browser unknown component classification and no-reclassification evidence
        env:
          EMPIRICAL_BROWSER_BASE_URL: http://127.0.0.1:4173
          EMPIRICAL_BROWSER_ARTIFACT_DIR: artifacts/empirical-unknown-browser
        run: node scripts/verify-empirical-nearest-browser.mjs
      - name: Stage-2 R2 real Chromium single / ATTA / Mode A source-mass isolation
        env:
          EMPIRICAL_BROWSER_BASE_URL: http://127.0.0.1:4173
          EMPIRICAL_BROWSER_ARTIFACT_DIR: artifacts/empirical-unknown-browser
        run: node scripts/verify-empirical-ir-r2-browser.mjs
      - name: Stage-2 R3 real Chromium consolidated easy-weight authority
        env:
          EMPIRICAL_BROWSER_BASE_URL: http://127.0.0.1:4173
          EMPIRICAL_BROWSER_ARTIFACT_DIR: artifacts/empirical-unknown-browser
        run: node scripts/verify-empirical-ir-r3-mode-a-browser.mjs
      - name: Download SHA-pinned public GLRD inputs matching Owner ZIP manifest
        run: |
          mkdir -p /tmp/glrd-inputs
          root="https://raw.githubusercontent.com/reallakshman19/3D_Converters/3377b7f4baeeee5851e72dcc414d6c4a93f5a933/Benchmarks/XML-CII-2019/revamped"
          master="https://raw.githubusercontent.com/reallakshman19/3D_Converters/25db94769994751bb0fb6e6d83a578efd9ac8162/docs/docs/Masters"
          curl --retry 3 --fail --location --silent --show-error "$root/GLRD-1000-PI-01%20-%20BM2.xml" -o "/tmp/glrd-inputs/GLRD-1000-PI-01 - BM2.xml"
          curl --retry 3 --fail --location --silent --show-error "$root/STF_2026Nov03-0839_managed_stage.json" -o /tmp/glrd-inputs/STF_2026Nov03-0839_managed_stage.json
          curl --retry 3 --fail --location --silent --show-error "$root/LL_BM2.xlsx" -o /tmp/glrd-inputs/LL_BM2.xlsx
          curl --retry 3 --fail --location --silent --show-error "$master/wtValveweights.json" -o /tmp/glrd-inputs/wtValveweights.json
          cd /tmp/glrd-inputs
          echo "6bcc477860fdbe9a80159839bf476a8c1e6ce7a966587a25bc62498709843151  GLRD-1000-PI-01 - BM2.xml" | sha256sum -c -
          echo "1d2469fe05d712cd1dd2da9913a840516ae686fb1616eb6d7b5e14d8918e2746  STF_2026Nov03-0839_managed_stage.json" | sha256sum -c -
          echo "73496a1277cd1f39de823d57180ee0d8c4b1d72241923f1e558af2c7c805d007  LL_BM2.xlsx" | sha256sum -c -
      - name: Chromium real GLRD full review census + standalone/ATTA/Mode A draft/approval
        env:
          GLRD_INPUT_DIR: /tmp/glrd-inputs
          EMPIRICAL_BROWSER_BASE_URL: http://127.0.0.1:4173
          EMPIRICAL_BROWSER_ARTIFACT_DIR: artifacts/empirical-unknown-browser
        run: node scripts/verify-glrd-rigid-review-popups-browser.mjs

      - name: Native GLRD BM2 unedited CII output parity on original source/staged/linelist
        run: |
          git fetch --no-tags --depth=1 origin e0939f05833d37fba201ba748aa09372560dc051
          git worktree add --detach /tmp/glrd-v04-main e0939f05833d37fba201ba748aa09372560dc051
          python3 scripts/verify-glrd-bm2-native-parity.py --inputs /tmp/glrd-inputs --before-root /tmp/glrd-v04-main --after-root . --out artifacts/glrd-native-parity

      - name: Upload browser screenshots and receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: empirical-unknown-component-${{ github.sha }}
          path: |
            artifacts/empirical-unknown-browser/**
            artifacts/glrd-native-parity/**
            /tmp/empirical-unknown-browser.log
          if-no-files-found: warn
