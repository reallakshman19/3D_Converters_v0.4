name: XML-CII rigid mass ownership audit
on:
  push:
    branches:
      - audit/xml-cii-rigid-api-weight-20261106
  pull_request:
    paths:
      - 'converters/xml-cii2019-core/rigid-weight-empirical-audit.js'
      - 'tabs/xml-cii-2019-standalone/xml-cii-workflow-service.js'
      - 'tests/rigid-weight-empirical-audit.test.mjs'
      - '.github/workflows/xml-cii-rigid-mass-audit.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  synthetic-and-production-empirical:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check module syntax
        run: |
          node --check converters/xml-cii2019-core/rigid-weight-empirical-audit.js
          node --check tabs/xml-cii-2019-standalone/xml-cii-workflow-service.js
          node --check tests/rigid-weight-empirical-audit.test.mjs
      - name: Test rigid ownership, release gate and the production empirical weight API
        run: node tests/rigid-weight-empirical-audit.test.mjs
